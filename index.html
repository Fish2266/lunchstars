<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunch Stars</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #0006; pointer-events: none; }
      #help { position: fixed; left: 12px; bottom: 12px; color: #fff; font-size: 13px; line-height: 1.5; text-shadow: 0 1px 2px #000a; pointer-events: none; }
      #help b { color: #ffe066; }
      #crosshair.hit { background: #ff3b3b; transform: scale(2.2) rotate(45deg); border-radius: 1px; transition: none; }
      #crosshair { transition: transform 0.12s, background 0.12s; }
      #crosshair.reach { width: 22px; height: 22px; margin: -11px 0 0 -11px; background: transparent; border: 3px solid #ffd54a; box-shadow: 0 0 0 2px #0006; }
      #hud { position: fixed; right: 16px; bottom: 14px; color: #fff; text-align: right; text-shadow: 0 2px 3px #000a; pointer-events: none; }
      #hud .hands { display: flex; gap: 10px; justify-content: flex-end; }
      #hud .slot { min-width: 120px; padding: 8px 12px; border-radius: 12px; background: #0005; border: 2px solid transparent; text-align: left; }
      #hud .slot.active { border-color: #ffd54a; background: #0007; }
      #hud .slot .k { display: inline-block; min-width: 18px; padding: 1px 6px; margin-right: 6px; border-radius: 6px; background: #fff3; font-size: 12px; font-weight: 800; text-align: center; }
      #hud .slot .name { font-size: 18px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
      #hud .slot .ammo { font-size: 13px; opacity: 0.85; }
      #hud .slot.empty .name { opacity: 0.5; font-size: 15px; }
      #hud .slot.gripping { border-color: #7fd0ff; }
      #hud .slot.gripping .name { color: #bfe6ff; }
      #hud .swap { font-size: 12px; opacity: 0.8; margin-top: 4px; }
      #debughud { position: fixed; left: 12px; top: 12px; display: none; width: 330px; padding: 8px 10px; border-radius: 10px;
        background: #000a; color: #dfe6ff; font: 12px/1.45 ui-monospace, monospace; pointer-events: none; }
      #debughud .p { margin: 4px 0 8px; }
      #debughud .bar { height: 6px; margin: 3px 0; background: #fff2; border-radius: 3px; overflow: hidden; }
      #debughud .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd54a, #ff4a4a); }
      #debughud .out { color: #ff6b6b; font-weight: 700; }
      #hud .stun { color: #ffd54a; font-weight: 700; }
      /* Shown by the HTML itself, so it's up instantly while the game (physics engine, 3D) downloads and starts. */
      #loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: radial-gradient(circle at 50% 40%, #2b3366, #141832); color: #c8cff5; font-family: system-ui, sans-serif;
        transition: opacity 0.35s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 { margin: 0; font-size: 44px; letter-spacing: 0.02em; color: #ffd54a; text-shadow: 0 4px 0 #b5502d; }
      #loading .msg { font-size: 16px; letter-spacing: 0.08em; }
      #loading .bar { width: 180px; height: 6px; border-radius: 3px; background: #ffffff1f; overflow: hidden; }
      #loading .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #ffd54a; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="loading" role="status"><h1>LUNCH STARS</h1><div class="msg">Loading…</div><div class="bar"><i></i></div></div>
    <div id="crosshair"></div>
    <div id="help"></div>
    <div id="hud">
      <div class="hands"><div class="slot" data-hand="0"></div><div class="slot" data-hand="1"></div></div>
      <div class="stun"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
