<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunch Stars</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #0006; pointer-events: none; }
      #help { position: fixed; left: 12px; bottom: 12px; color: #fff; font-size: 13px; line-height: 1.5; text-shadow: 0 1px 2px #000a; pointer-events: none; }
      #help b { color: #ffe066; }
      #crosshair.hit { background: #ff3b3b; transform: scale(2.2) rotate(45deg); border-radius: 1px; transition: none; }
      #crosshair { transition: transform 0.12s, background 0.12s; }
      #hud { position: fixed; right: 16px; bottom: 14px; color: #fff; text-align: right; text-shadow: 0 2px 3px #000a; pointer-events: none; }
      #hud .hands { display: flex; gap: 10px; justify-content: flex-end; }
      #hud .slot { min-width: 120px; padding: 8px 12px; border-radius: 12px; background: #0005; border: 2px solid transparent; text-align: left; }
      #hud .slot.active { border-color: #ffd54a; background: #0007; }
      #hud .slot .k { display: inline-block; min-width: 18px; padding: 1px 6px; margin-right: 6px; border-radius: 6px; background: #fff3; font-size: 12px; font-weight: 800; text-align: center; }
      #hud .slot .name { font-size: 18px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
      #hud .slot .ammo { font-size: 13px; opacity: 0.85; }
      #hud .slot.empty .name { opacity: 0.5; font-size: 15px; }
      #hud .swap { font-size: 12px; opacity: 0.8; margin-top: 4px; }
      #hud .stun { color: #ffd54a; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="help"></div>
    <div id="hud">
      <div class="hands"><div class="slot" data-hand="0"></div><div class="slot" data-hand="1"></div></div>
      <div class="stun"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
